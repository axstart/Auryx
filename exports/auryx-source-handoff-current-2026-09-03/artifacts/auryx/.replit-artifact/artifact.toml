kind = "web"
previewPath = "/"
title = "Auryx — Precision Longevity"
version = "1.0.0"
id = "artifacts/auryx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25121

[services.development]
run = "pnpm --filter @workspace/auryx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auryx", "run", "build" ]
publicDir = "artifacts/auryx/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25121"
BASE_PATH = "/"
